<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
</head>
    <style>
    #wrapper{
        background-color: #2B5748;
        padding: 20px;
        width: 80%;
        max-width: 470px;
        border-radius: 10px;
    }
    h1{
        text-align: center;
        
    }
    p{
        text-align: center;
        color: white;
        font-size: 20px;
    }
    .form{
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .form label{
        font-size: 40px;
        font-weight: 600;
    }
    .guessfield{
        height: 30px;
        width: 250px;
        border-radius: 10px;
        border: none;
        margin-top: 10px;
        margin-bottom: 30px;
    }
    #sub{
        height: 30px;
        width: 150px;
        background-color: black;
        color: white;
        font-size: 13px;
        border-radius: 5px;
        box-shadow: 0 0 25px rgba(0, 242,254,0.6);

    }

</style>
<body style="background-color: #9CB080; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; ">
    <div id="wrapper">
        <h1>Number Guessing Game</h1>
        <p>Try and guess a random number between 1 and 100.</p>
        <p>You have 10 attempts to guess the right number</p>
        <br>
        <form class="form">
              <label for="guessfield" id="guess">Guess a number</label>
              <input type="text" id="guessfield" class="guessfield">
              <input type="submit" id="sub" class="guessSubmit" value="Submit Guess">
        </form>

        <div class="result">
            <p>Previous Guesses: <span class="guesses"></span></p>
            <p>Guesses Remaining: <span class="lastResult">10</span></p>
            <p class="looHi"></p>
        </div>
    </div>

    <script>
        let user=document.querySelector(`#guessfield`);
        let wrapper=document.querySelector('#wrapper')
        let submit_btn=document.querySelector(`#sub`);
        let preguess=document.querySelector(`.guesses`);
        let remaining=document.querySelector(`.lastResult`);
        let loohii=document.querySelector(`.looHi`);

        let random_num=parseInt(Math.random()*100+1);

        let preguess_arr=[];
        let guess_remain=10;

        let playgame=true;
        let message;

        if(playgame)
    {
        submit_btn.addEventListener(`click`,function(e)
    {
        e.preventDefault();
        let guess=parseInt(user.value);
        if(isNaN(guess))
    {
        alert(`Enter number(only) in range 1 to 100`);
    }
    else if(guess<1)
    {
        alert(`Enter number greater than 1`);
    }
    else if(guess>100)
    {
        alert(`Enter number less than 100`)
    }
    else 
    {
        preguess_arr.push(guess);
        guess_remain-=1;

        preguess.innerHTML=preguess_arr.join(', ');
        remaining.innerHTML=guess_remain;

        user.value='';
        if(guess_remain<=0)
    {
        message=(`You are out of guesses. The random number was ${random_num}`);
        message_display(message);
        end();
    }
    else{
        high_low(guess);
    }
    }

    })
    }


    function high_low(guess)
    {
        if(guess===random_num)
    {
        message=(`Congratulations! You have found out the correct number`);
        message_display(message);
        end();
    }
    else if(guess<random_num)
    {
        message=(`Too low`);
        message_display(message);
    }
    else{
        message=(`Too High`);
        message_display(message);
    }
    }

    function message_display(message)
    {
        loohii.textContent=message;
    }

    function end()
    {
        submit_btn.setAttribute(`disabled`, '')
        user.setAttribute(`disabled`, '')
        let restart_btn=document.createElement('button');
        restart_btn.id='newgamebutton';
        restart_btn.textContent='Start New Game';
        restart_btn.style.cursor='pointer';
        wrapper.appendChild(restart_btn)
        playgame=false;
        restart_btn.addEventListener('click',function()
    {
         newGame(restart_btn);

    })

    }


    function newGame(restart_btn)
    {
         random_num=parseInt(Math.random()*100+1);
         preguess_arr=[];
         guess_remain=10;
         preguess.innerHTML='';
         remaining.innerHTML=guess_remain;
         user.removeAttribute('disabled');
         submit_btn.removeAttribute('disabled');
         restart_btn.remove();
         user.value='';
         loohii.value='';
         playgame=true;
        


    }

    </script>
</body>
</html>
