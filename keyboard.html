<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard</title>
</head>
<style>
    body{
        margin: 0;
        padding: 0;
    }
    h1{
        background-color: #468432;
        height: 50px;
        color: white;
        text-align: center;
        padding-top: 20px;
        position: fixed;
        width: 100%;
    }
    table, th, td{
        border: 1px solid #e7e7e7;
    }
    .project{
        background-color: #1c1c1c;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        height: 100vh;
    }
    .color{
        color: aliceblue;
        display: flex;
        flex-direction: row;
    }
</style>
<body>
    <h1>Keyboard game</h1>
    <div class="project">
        <div id="insert">
            <div  class="key">Press the key and watch magic</div>
        </div>
    </div>

    <script>
        let insert=document.querySelector('#insert');
        window.addEventListener('keydown',function(e){
            insert.innerHTML=`<div class='color'>
                <table>
  <tr>
    <th>key</th>
    <th>keycode</th>
    <th>code</th>
  </tr>
  <tr>
    <td>${e.key==='' ? "Space": e.key}</td>
    <td>${e.keyCode} </td>
    <td>${e.code}</td>
  </tr>
  
</table>
</div>`;
            
         });

    </script>
</body>
</html>
