<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI calculator</title>
</head>
<style>

    #main{
        background-color: #2FA084;
        box-shadow: 0 0 25px rgba(0, 242,254,0.6);
        padding: 2rem;
        width: 90%;
        max-width: 450px;
        display: flex;
        flex-direction: column;
        align-items: center;
        border-radius: 12px;
        }
        label{
            font-size: 1.3rem;
        }
        input{
            font-size: 1.3rem;
            border-radius: 10px;
            border: none;
        }
        button{
            font-size: 1.1rem;
            margin-left: 130px;
            border-radius: 10px;
            border: 2px solid #F48F68;
            height: 40px;
            width: 150px;
        }
        #result{
            width: 200px;
            margin-left: 90px;
            text-align: center;
            font-size: 20px;
            border: 3px solid rgb(88, 88, 173);
            border-radius: 10px ;
        }
      
</style>
<body style="background-color: #6FCF97; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div id="main">
          <h1>BMI Calculator</h1>
    <form>
        <label for="height">Height in cm: </label>
        <input type="number" id="height">
        <br><br>
        <label for="weight">Weight in kg: </label>
        <input type="number" id="weight">
        <br><br>
        <button>Calculate</button>
        <br><br>
        <div id="result"></div>
    </form>
    <div id="guide">
        <h3>BMI Weight Guide</h3>
        <p>Under Weight=Less than 18.6</p>
        <p>Normal Range=18.6 and 24.9</p>
        <p>Overweight=Greater than 24.9</p>
    </div>
    </div>
  
</body>
<script>
    let form=document.querySelector(`form`);
    form.addEventListener(`submit`,bmi_calculator);
    function bmi_calculator(e)
    {
        e.preventDefault();

        let height=document.querySelector(`#height`).value;
        let weight=document.querySelector(`#weight`).value;
        let result=document.querySelector(`#result`);

        if(height==="" || height<0 || isNaN(height))
    {
        result.innerHTML="Please give a valid height";
    }
        else if(weight==="" || weight<0 || isNaN(weight))
    {
        result.innerHTML="Please give a valid weight";
    }
        else
    {

        let bmi=(weight/((height*height)/10000)).toFixed(2);
        let message;
        if(bmi<18.6)
    {
        message="Underweight";
        result.innerHTML=`BMI: ${bmi}, ${message}"`;
    }
        else if(bmi>=18.6 && bmi<=24.9)
    {
         message="normal";
        result.innerHTML=`BMI: ${bmi} ${message}`;
    }
    else{
        message="Overweight";
        result.innerHTML=`BMI:${bmi}, ${message}`;
    }
    }
    }
</script>
</html>
