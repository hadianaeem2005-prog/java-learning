<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
</head>
<style>
    .center{ 
         background-color: #2FA084;
        box-shadow: 0 0 25px rgba(0, 242,254,0.6);
        width: 90%;
        max-width: 450px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;

    }
    #clock{
        border: 4px solid rgb(136, 26, 26);
        box-shadow: 0 0 25px rgba(0, 241, 254, 0.644);
        color: black;
        border-radius: 15px;
        height: 100px;
        width: 300px;
        text-align: center;
        font-size: 40px;
        padding-top: 60px;
    }
    #banner{
        font-size: 1.4rem;
        font-family: cursive;
        font-weight: 900;
        font-style: italic;
        padding: 20px;
    }
</style>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; min-height: 100vh;">
    <div class="center">
        <div id="banner">Your Local Time</div>
        <div id="clock"></div>
    </div>
</body>
<script>
    const clock=document.querySelector('#clock');
    setInterval(function(){
        let date=new Date();
        clock.innerHTML=date.toLocaleTimeString();
    }, 1000);
</script>
</html>
